name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Scrappy-linux
          - os: windows-2022
            artifact: Scrappy-windows
          - os: macos-13
            artifact: Scrappy-macos-intel
          - os: macos-14
            artifact: Scrappy-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

      - name: Build app
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name Scrappy
          --hidden-import keyring.backends.chainer
          --hidden-import keyring.backends.fail
          --hidden-import keyring.backends.null
          --hidden-import keyring.backends.macOS
          --hidden-import keyring.backends.Windows
          --hidden-import keyring.backends.SecretService
          --hidden-import keyring.backends.kwallet
          main.py

      - name: Package artifact
        env:
          SCRAPPY_ARTIFACT_NAME: ${{ matrix.artifact }}
        run: python scripts/package_artifact.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error
