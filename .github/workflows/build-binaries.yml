name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Scrappy-linux
          - os: windows-2022
            artifact: Scrappy-windows
          - os: macos-14
            artifact: Scrappy-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v

      - name: Build app
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name Scrappy
          --hidden-import keyring.backends.chainer
          --hidden-import keyring.backends.fail
          --hidden-import keyring.backends.null
          --hidden-import keyring.backends.macOS
          --hidden-import keyring.backends.Windows
          --hidden-import keyring.backends.SecretService
          --hidden-import keyring.backends.kwallet
          main.py

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - --options runtime dist/Scrappy.app
          codesign --verify --deep --strict --verbose=2 dist/Scrappy.app

      - name: Package artifact
        env:
          SCRAPPY_ARTIFACT_NAME: ${{ matrix.artifact }}
        run: python scripts/package_artifact.py

      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        run: |
          rm -rf packaged-check
          mkdir packaged-check
          ditto -x -k "artifacts/${{ matrix.artifact }}.zip" packaged-check
          codesign --verify --deep --strict --verbose=2 packaged-check/Scrappy.app

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf packaged-check
          mkdir packaged-check
          unzip -q "artifacts/${{ matrix.artifact }}.zip" -d packaged-check
          test -x packaged-check/Scrappy/Scrappy
          packaged-check/Scrappy/Scrappy --help

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force packaged-check -ErrorAction SilentlyContinue
          New-Item -ItemType Directory packaged-check | Out-Null
          Expand-Archive -Path "artifacts/${{ matrix.artifact }}.zip" -DestinationPath packaged-check
          if (-not (Test-Path "packaged-check/Scrappy/Scrappy.exe")) {
            throw "Packaged executable not found"
          }
          & ".\packaged-check\Scrappy\Scrappy.exe" --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
