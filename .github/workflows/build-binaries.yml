name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: Scrappy-linux
          - os: windows-2022
            artifact: Scrappy-windows
          - os: macos-14
            artifact: Scrappy-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libdbus-1-3 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          go test ./...
          python -m pytest tests/ -v

      - name: Build Go core
        run: python scripts/build_core.py

      - name: Build app
        run: python scripts/build_desktop.py

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Scrappy.app
          codesign --verify --deep --strict --verbose=2 dist/Scrappy.app

      - name: Package artifact
        env:
          SCRAPPY_ARTIFACT_NAME: ${{ matrix.artifact }}
        run: python scripts/package_artifact.py

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          rm -rf dmg-root
          mkdir dmg-root
          ditto dist/Scrappy.app dmg-root/Scrappy.app
          ln -s /Applications dmg-root/Applications
          hdiutil create \
            -volname Scrappy \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            "artifacts/${{ matrix.artifact }}.dmg"

      - name: Verify packaged macOS app
        if: runner.os == 'macOS'
        run: |
          rm -rf packaged-check
          mkdir packaged-check
          ditto -x -k "artifacts/${{ matrix.artifact }}.zip" packaged-check
          codesign --verify --deep --strict --verbose=2 packaged-check/Scrappy.app
          packaged-check/Scrappy.app/Contents/MacOS/Scrappy --help
          packaged-check/Scrappy.app/Contents/Frameworks/scrappy-core --version

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          rm -rf packaged-check
          mkdir packaged-check
          unzip -q "artifacts/${{ matrix.artifact }}.zip" -d packaged-check
          test -x packaged-check/Scrappy/Scrappy
          archive_listing="$(printf 'O PYZ-00.pyz\nL\nQ\nQ\n' | pyi-archive_viewer packaged-check/Scrappy/Scrappy)"
          echo "$archive_listing" | grep -q "'backports'"
          echo "$archive_listing" | grep -q "'backports.tarfile'"
          test -x packaged-check/Scrappy/_internal/scrappy-core
          packaged-check/Scrappy/_internal/scrappy-core --version
          env -i HOME="$HOME" QT_QPA_PLATFORM=offscreen packaged-check/Scrappy/Scrappy --help

      - name: Smoke test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force packaged-check -ErrorAction SilentlyContinue
          New-Item -ItemType Directory packaged-check | Out-Null
          Expand-Archive -Path "artifacts/${{ matrix.artifact }}.zip" -DestinationPath packaged-check
          if (-not (Test-Path "packaged-check/Scrappy/Scrappy.exe")) {
            throw "Packaged executable not found"
          }
          if (-not (Test-Path "packaged-check/Scrappy/_internal/scrappy-core.exe")) {
            throw "Packaged Go core not found"
          }
          & ".\packaged-check\Scrappy\_internal\scrappy-core.exe" --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ".\packaged-check\Scrappy\Scrappy.exe" --help
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            artifacts/*.zip
            artifacts/*.dmg
          if-no-files-found: error

      - name: Upload binaries to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.zip
            artifacts/*.dmg
